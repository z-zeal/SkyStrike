name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  # Hosted runner acquisition fails occasionally ("the job was not acquired by Runner of type
  # hosted"), which is an infrastructure outcome rather than a result. Without this, re-running
  # a build that never actually ran requires an empty commit.
  workflow_dispatch:

jobs:
  build-and-test:
    # Pinned rather than 'ubuntu-latest': three consecutive runs across two branches died with
    # "the job was not acquired by Runner of type hosted even after multiple attempts", which is
    # a scheduling failure and not a build result. An explicit image label asks a concrete pool.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check module dependencies
        run: ./gradlew checkModuleDependencies --no-daemon

      - name: Compile and run shared tests
        run: ./gradlew shared:test --no-daemon

      - name: Compile and run server tests
        run: ./gradlew server:test --no-daemon

      - name: Compile Java for all subprojects
        run: ./gradlew shared:compileJava server:compileJava core:compileJava tools:compileJava --no-daemon

      # The map gate, wired in milestone 5 slice B. `MapTool check` is the §7 reachability gate over
      # the map this build ships: it fails when the map's spawns cannot reach each other (plan
      # §11.4's decision, 2026-10-12) and warns, naming every stance, when a map is merely not
      # fully reachable — which the shipped arena is, by the ten stances sealed in the milestone-4
      # fixture door's alcove. `MapTool bake --check` then proves the committed asset is the bake of
      # that same map, byte for byte, which is the only place a binary a client loads by hash can be
      # checked without a GPU.
      - name: Audit the shipped map (MapTool check)
        run: ./gradlew tools:mapCheck --no-daemon

      - name: Verify the shipped SDF bake (MapTool bake --check)
        run: ./gradlew tools:mapBakeCheck --no-daemon

      - name: Print failing test details
        if: failure()
        run: |
          for f in shared/build/test-results/test/*.xml server/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            if grep -q '<failure' "$f"; then
              echo "=== $f ==="
              cat "$f"
            fi
          done
