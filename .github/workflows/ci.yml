name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check module dependencies
        run: ./gradlew checkModuleDependencies --no-daemon

      - name: Compile and run shared tests
        id: shared_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew shared:test --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Compile and run server tests
        id: server_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew server:test --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Compile Java for all subprojects
        id: compile_all
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew shared:compileJava server:compileJava core:compileJava --no-daemon 2>&1 | tee -a /tmp/build.log

      # TEMPORARY (Phase 3): the authoring sandbox cannot reach the Actions log hosts, so the
      # build output is echoed back through the API as a pull request comment. Remove together
      # with continue-on-error above once the build is green.
      - name: Report build output to the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY' > /tmp/report.md
          import glob
          import os
          import xml.etree.ElementTree as ET

          LIMIT = 55000
          out = []

          failures = []
          for path in sorted(glob.glob('*/build/test-results/test/*.xml')):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:  # noqa: BLE001
                  failures.append((path, '', 'unparsable: %s' % exc))
                  continue
              for case in root.iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      failures.append((
                          case.get('classname', '?'),
                          case.get('name', '?'),
                          (bad.get('message') or '') + '\n' + (bad.text or '')))

          out.append('### Build report\n')
          if failures:
              out.append('%d failing test case(s):\n' % len(failures))
              for cls, name, msg in failures[:40]:
                  out.append('<details><summary>%s — %s</summary>\n\n```\n%s\n```\n</details>\n'
                             % (cls, name, msg.strip()[:4000]))
          else:
              out.append('No JUnit failures recorded (a compile error produces no XML).\n')

          log = ''
          if os.path.exists('/tmp/build.log'):
              with open('/tmp/build.log', encoding='utf-8', errors='replace') as handle:
                  log = handle.read()
          interesting = [line for line in log.splitlines()
                         if 'error:' in line
                         or line.startswith('e: ')
                         or 'warning:' in line
                         or 'FAILED' in line
                         or 'Execution failed' in line
                         or 'Caused by' in line
                         or '.java:' in line]
          if interesting:
              out.append('\n### Compiler / Gradle lines\n\n```\n%s\n```\n'
                         % '\n'.join(interesting[:400]))

          out.append('\n### Tail of the build log\n\n```\n%s\n```\n'
                     % '\n'.join(log.splitlines()[-120:]))

          text = ''.join(out)
          print(text[:LIMIT])
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/report.md

      - name: Fail if any build step failed
        if: always()
        run: |
          if [ "${{ steps.shared_tests.outcome }}" != "success" ] \
            || [ "${{ steps.server_tests.outcome }}" != "success" ] \
            || [ "${{ steps.compile_all.outcome }}" != "success" ]; then
            echo "one or more build steps failed"
            exit 1
          fi
