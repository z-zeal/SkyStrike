# TEMPORARY debug workflow: captures gradle output by committing logs back to the
# branch, because the sandbox cannot read GitHub's Azure-hosted CI log blobs.
# Delete before the PR.
name: Debug Capture

on:
  push:
    branches: [ "arena/943b6768-skystrike" ]
    paths: [ ".github/workflows/debug-capture.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/943b6768-skystrike

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and capture
        run: |
          mkdir -p ci-capture
          set +e
          ./gradlew shared:test --no-daemon > ci-capture/shared-test.log 2>&1
          echo "shared-test exit: $?" >> ci-capture/exit-codes.txt
          ./gradlew server:test --no-daemon > ci-capture/server-test.log 2>&1
          echo "server-test exit: $?" >> ci-capture/exit-codes.txt
          ./gradlew shared:compileJava server:compileJava core:compileJava lwjgl3:compileJava --no-daemon > ci-capture/compile-all.log 2>&1
          echo "compile-all exit: $?" >> ci-capture/exit-codes.txt
          true

      - name: Commit capture
        run: |
          git config user.name "arena-debug-bot"
          git config user.email "arena-debug-bot@users.noreply.github.com"
          git add ci-capture/
          git commit -m "ci debug capture (temporary; do not merge)" || echo "no changes"
          git push origin arena/943b6768-skystrike
