name: Debug Capture

# Temporary diagnostic workflow: this sandbox cannot run Gradle/JDK locally and the
# Actions log blob storage is frequently unreachable from here, so we capture build/test
# output directly into the repo on push to this branch. Delete this file once the
# session confirms CI is green on the real workflow.

on:
  push:
    branches: [ "arena/b01210ce-skystrike" ]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run gradle tasks, capturing output regardless of failure
        run: |
          set +e
          mkdir -p ci-capture
          ./gradlew shared:test --no-daemon > ci-capture/shared-test.log 2>&1
          echo "shared-test exit: $?" >> ci-capture/exit-codes.txt
          ./gradlew server:test --no-daemon > ci-capture/server-test.log 2>&1
          echo "server-test exit: $?" >> ci-capture/exit-codes.txt
          ./gradlew shared:compileJava server:compileJava core:compileJava --no-daemon > ci-capture/compile-all.log 2>&1
          echo "compile-all exit: $?" >> ci-capture/exit-codes.txt
          mkdir -p ci-capture/results-shared ci-capture/results-server
          cp shared/build/test-results/test/*.xml ci-capture/results-shared/ 2>/dev/null || true
          cp server/build/test-results/test/*.xml ci-capture/results-server/ 2>/dev/null || true
          exit 0

      - name: Commit captured output
        run: |
          git config user.name "arena-ci-debug-bot"
          git config user.email "arena-ci-debug-bot@users.noreply.github.com"
          git add -f ci-capture
          git diff --cached --quiet || git commit -m "ci debug capture (temporary; do not merge)"
          git push
