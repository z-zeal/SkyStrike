buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.9.3"

  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - project(':android')) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17
  java.targetCompatibility = 17

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'SkyStrike'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'SkyStrike' + '-parent'

tasks.register('checkModuleDependencies') {
  doLast {
    // Resolve imports to the module that owns the referenced Java type. Core's packages live
    // beside shared under io.github.skystrike (audio, fx, ui, ...), not under a .core package.
    def checkedModules = ['shared', 'server', 'core']
    def ownerByType = [:]
    def ownerByPackage = [:].withDefault { [] }
    checkedModules.each { module ->
      fileTree("$rootDir/$module/src").matching { include '**/*.java' }.files.each { f ->
        def packageMatcher = f.getText('UTF-8') =~ /(?m)^package\s+([\w.]+);/
        if (packageMatcher.find()) {
          def packageName = packageMatcher.group(1)
          def typeName = f.name.replaceFirst(/\.java$/, '')
          ownerByType["$packageName.$typeName"] = module
          if (!ownerByPackage[packageName].contains(module)) {
            ownerByPackage[packageName] << module
          }
        }
      }
    }

    def forbidden = [shared: ['core', 'server'], server: ['core'], core: ['server']]
    forbidden.each { module, deniedModules ->
      fileTree("$rootDir/$module/src").matching { include '**/*.java' }.files.each { f ->
        def source = f.getText('UTF-8')
        if (module in ['shared', 'server'] && source.contains('com.badlogic.gdx')) {
          throw new GradleException("$module must not reference LibGDX: $f")
        }

        def imports = source =~ /(?m)^\s*import\s+(static\s+)?([\w.*]+);/
        while (imports.find()) {
          def target = imports.group(2)
          if (imports.group(1) != null) {
            target = target.substring(0, target.lastIndexOf('.'))
          }
          def referencedType = null
          def owner = null
          def candidate = target
          while (candidate.contains('.')) {
            if (ownerByType.containsKey(candidate)) {
              referencedType = candidate
              owner = ownerByType[candidate]
              break
            }
            def dot = candidate.lastIndexOf('.')
            if (dot <= 0) {
              break
            }
            candidate = candidate.substring(0, dot)
          }
          if (referencedType == null && target.endsWith('.*')) {
            def packageName = target.substring(0, target.length() - 2)
            def packageOwners = ownerByPackage[packageName]
            owner = packageOwners.find { deniedModules.contains(it) }
            if (owner != null) {
              referencedType = packageName + '.*'
            }
          }
          if (deniedModules.contains(owner)) {
            throw new GradleException(
              "$module must not reference $owner type/package $referencedType: $f")
          }
        }
      }
    }
  }
}
subprojects { tasks.matching { it.name == 'compileJava' }.configureEach { dependsOn rootProject.tasks.named('checkModuleDependencies') } }
